name: collect

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'config/**', '.github/workflows/collect.yml']

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Coletar dados
        run: node scripts/collect.mjs
      - name: Commitar dados
        run: |
          git config user.name "rankeds-bot"
          git config user.email "rankeds-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): atualizar $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
